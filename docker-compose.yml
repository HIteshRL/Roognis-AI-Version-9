# ─────────────────────────────────────────────────────────────────────────────
# Roognis AI — Docker Compose (Local Development + Staging)
# All services are ENV-var driven for zero-code cloud migration
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  chroma_data:
  ollama_models:
  comfy_models:
  file_storage:

services:

  # ── API Gateway ─────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v2.11
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    restart: unless-stopped

  # ── Databases ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: roognis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roognis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chromadb:
    profiles: ["local-ai"]
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # ── AI Layer ─────────────────────────────────────────────────────────────────
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    healthcheck:
      # Passes only after the RAG embedding model is pulled and ready.
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q nomic-embed-text"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  comfyui:
    profiles: ["local-ai"]
    image: ghcr.io/ai-dock/comfyui:latest
    ports:
      - "8188:8188"
    volumes:
      - comfy_models:/opt/ComfyUI/models
      - file_storage:/opt/ComfyUI/output
    restart: unless-stopped

  # ── Application Services ─────────────────────────────────────────────────────

  auth:
    build: ./services/auth
    command: >
      sh -c "npx prisma db push --schema=prisma/schema.prisma &&
             node scripts/seed.js &&
             node server.js"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/roognis?schema=auth_db"
      JWT_SECRET: ${JWT_SECRET}
      DEMO_SCHOOL_ID: ${DEMO_SCHOOL_ID:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_SCHOOL_ID: ${BOOTSTRAP_SCHOOL_ID:-}
      BOOTSTRAP_SCHOOL_NAME: ${BOOTSTRAP_SCHOOL_NAME:-}
      BOOTSTRAP_TEACHER_NAME: ${BOOTSTRAP_TEACHER_NAME:-}
      BOOTSTRAP_TEACHER_EMAIL: ${BOOTSTRAP_TEACHER_EMAIL:-}
      BOOTSTRAP_TEACHER_PASSWORD: ${BOOTSTRAP_TEACHER_PASSWORD:-}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
    restart: unless-stopped

  ai:
    build: ./services/ai
    command: >
      sh -c "[ -f prisma/schema.prisma ] &&
             npx prisma db push --schema=prisma/schema.prisma ||
             true && node server.js"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/roognis?schema=ai_db"
      JWT_SECRET: ${JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.1-flash-lite}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_QUIZ_MODEL: ${OPENROUTER_QUIZ_MODEL:-openai/gpt-5-mini}
      OPENROUTER_QUIZ_REASONING_EFFORT: ${OPENROUTER_QUIZ_REASONING_EFFORT:-low}
      OPENROUTER_QUIZ_TIMEOUT_MS: ${OPENROUTER_QUIZ_TIMEOUT_MS:-60000}
      OPENROUTER_QUIZ_MAX_COMPLETION_TOKENS: ${OPENROUTER_QUIZ_MAX_COMPLETION_TOKENS:-4200}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Roognis}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-youtube}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      VIDEO_SEARCH_MAX_RESULTS: ${VIDEO_SEARCH_MAX_RESULTS:-5}
      VIDEO_TRUSTED_CHANNELS: ${VIDEO_TRUSTED_CHANNELS:-}
      NEWS_REFRESH_ENABLED: ${NEWS_REFRESH_ENABLED:-true}
      NEWS_REFRESH_INTERVAL_MS: ${NEWS_REFRESH_INTERVAL_MS:-10800000}
      OLLAMA_URL: "http://ollama:11434"
      RAG_SERVICE_URL: "http://rag:3003"
      QUIZ_SERVICE_URL: "http://quiz:3005"
      ANALYTICS_URL: "http://analytics:3004"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      COMFYUI_URL: "http://comfyui:8188"
      FILE_STORAGE_PATH: /app/storage
      PORT: 3002
      NODE_ENV: production
      # Local fallback providers remain available with:
      # LLM_PROVIDER=ollama IMAGE_PROVIDER=comfyui docker-compose --profile local-ai up --build
      # Cloud swap — set to use S3 instead of Docker volume
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    volumes:
      - file_storage:/app/storage
      - ./seed-data:/app/seed-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/api/ai`)"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.services.ai.loadbalancer.server.port=3002"
    restart: unless-stopped

  rag:
    build: ./services/rag
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/roognis"
      CHROMA_URL: "http://chromadb:8000"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      DEMO_SCHOOL_ID: ${DEMO_SCHOOL_ID:-}
      JWT_SECRET: ${JWT_SECRET}
      FILE_STORAGE_PATH: /app/storage
      PORT: 3003
      RAG_TEST_MODE: ${RAG_TEST_MODE:-true}
      RAG_COLLECTION_PREFIX: ${RAG_COLLECTION_PREFIX:-school}
      RAG_MAX_UPLOAD_MB: ${RAG_MAX_UPLOAD_MB:-50}
      QUIZ_SERVICE_URL: "http://quiz:3005"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Cloud swap — set to use Pinecone instead of ChromaDB
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_ENV: ${PINECONE_ENV:-}
    volumes:
      - file_storage:/app/storage
      - ./seed-data:/app/seed-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rag.rule=PathPrefix(`/api/rag`)"
      - "traefik.http.routers.rag.entrypoints=web"
      - "traefik.http.services.rag.loadbalancer.server.port=3003"
    restart: unless-stopped

  textbook-seed:
    build: ./services/rag
    command: ["python", "seed_textbooks.py"]
    environment:
      AUTH_SERVICE_URL: "http://auth:3001"
      RAG_SERVICE_URL: "http://rag:3003"
      TEXTBOOK_SEED_MANIFEST: "/app/seed-data/ncert/class-8-textbooks.json"
      AUTO_SEED_TEXTBOOKS: ${AUTO_SEED_TEXTBOOKS:-true}
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-teacher@demo.com}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-demo1234}
    volumes:
      - ./seed-data:/app/seed-data:ro
    depends_on:
      auth:
        condition: service_healthy
      rag:
        condition: service_healthy
    restart: "no"

  quiz:
    build: ./services/quiz
    command: >
      sh -c "[ -f prisma/schema.prisma ] &&
             npx prisma db push --schema=prisma/schema.prisma ||
             true && node server.js"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/roognis?schema=quiz_db"
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      RAG_SERVICE_URL: "http://rag:3003"
      AI_SERVICE_URL: "http://ai:3002"
      ANALYTICS_URL: "http://analytics:3004"
      QUIZ_QUESTION_COUNT: ${QUIZ_QUESTION_COUNT:-10}
      PORT: 3005
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
      ai:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quiz.rule=PathPrefix(`/api/quiz`)"
      - "traefik.http.routers.quiz.entrypoints=web"
      - "traefik.http.services.quiz.loadbalancer.server.port=3005"
    restart: unless-stopped

  analytics:
    build: ./services/analytics
    command: >
      sh -c "[ -f prisma/schema.prisma ] &&
             npx prisma db push --schema=prisma/schema.prisma ||
             true && node server.js"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/roognis?schema=analytics_db"
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PORT: 3004
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analytics.rule=PathPrefix(`/api/analytics`)"
      - "traefik.http.routers.analytics.entrypoints=web"
      - "traefik.http.services.analytics.loadbalancer.server.port=3004"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "/api"
      API_PROXY_TARGET: "http://traefik"
      HOST: "0.0.0.0"
      PORT: 3000
      NODE_ENV: production
    depends_on:
      auth:
        condition: service_healthy
      textbook-seed:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    restart: unless-stopped

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: roognis
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        # Runs schema migration before the app starts.
        # initContainer ensures only one pod runs migrations even with replicas > 1.
        # No --accept-data-loss: a drifted schema must fail loudly, not drop columns.
        - name: db-migrate
          image: roognis/auth:latest
          command: ["npx", "prisma", "db", "push", "--schema=prisma/schema.prisma"]
          envFrom:
            - secretRef:
                name: auth-secrets
        # Seed is idempotent and must finish before the server accepts traffic.
        # It belongs here, not in a postStart hook — postStart does not gate readiness
        # and its process is not the container's main process.
        - name: seed
          image: roognis/auth:latest
          command: ["node", "scripts/seed.js"]
          envFrom:
            - secretRef:
                name: auth-secrets
      containers:
        - name: auth
          image: roognis/auth:latest
          command: ["node", "server.js"]
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: auth-secrets
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
